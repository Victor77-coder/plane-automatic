[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-cli"
version = "0.1.0"
description = "CLI para Intake, demandas de suporte e técnicas no Plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0,<9",
    "environs>=11.0.0,<15",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9"]

[project.scripts]
plane-cli = "plane_cli.cli:main"

[tool.setuptools.packages.find]
include = ["plane_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
